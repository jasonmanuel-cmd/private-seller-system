services:
  - type: web
    name: private-seller-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
  - type: worker
    name: private-seller-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --loop
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
