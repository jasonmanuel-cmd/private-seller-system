services:
  - type: web
    name: private-seller-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
  - type: worker
    name: private-seller-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --loop
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
