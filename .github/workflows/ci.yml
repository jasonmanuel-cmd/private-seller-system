name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: python -m pytest tests/ -v --cov=app --cov=database --cov=property_intelligence --cov=intelligence_pipeline --cov=reports --cov-report=term-missing
      - name: Type check
        run: python -m compileall -q app.py config.py database.py scoring.py run.py serve.py property_intelligence.py intelligence_pipeline.py reports.py scrapers
      - name: Lint
        continue-on-error: true
        run: pip install flake8 && python -m flake8 app.py database.py property_intelligence.py intelligence_pipeline.py reports.py --max-line-length=120

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safety
        run: pip install safety
      - name: Run security audit
        continue-on-error: true
        run: safety check
